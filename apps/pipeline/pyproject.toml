[project]
name = "reels-pipeline"
version = "0.1.0"
description = "Integration layer: trends -> MoneyPrinterTurbo -> approval gates -> Postiz"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "supabase>=2.6,<3",
  "boto3>=1.34,<2",
  "tenacity>=8.3,<9",
  "anthropic>=1.0,<2",
]

[project.optional-dependencies]
# Playwright and TikTok-Api only ship in the trends image; they are far too
# heavy for the Lambda image that runs the state machine activities.
trends = [
  "TikTokApi==7.3.3",
  "playwright>=1.36,<2",
  "pytrends>=4.9,<5",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.5"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
