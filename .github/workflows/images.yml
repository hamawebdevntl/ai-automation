# Builds and pushes the three container images.
#
# This exists because there is no Docker on the development machine, so images
# cannot be built locally. CI is the only path from source to a deployable
# image, and the resulting tag is what Terraform's image_tag variable takes.
name: images

on:
  push:
    branches: [main]
    paths:
      - "apps/pipeline/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC, so no long-lived AWS keys live in GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [activities, media, trends]
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/pipeline
          file: apps/pipeline/Dockerfile.${{ matrix.image }}
          # Lambda runs x86_64 here; the runner is the same, so no emulation.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/reels-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  summary:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Report the deployable tag
        run: |
          echo "### Images pushed" >> $GITHUB_STEP_SUMMARY
          echo "Deploy with: \`terraform apply -var image_tag=${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
