name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: apps/pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        working-directory: apps/pipeline
        run: ruff check pipeline tests
      - name: Test
        working-directory: apps/pipeline
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - working-directory: apps/web
        run: bun install --frozen-lockfile
      # Lint, typecheck and test. The build needs VITE_* values, which are
      # public by design but not in the repo, so it is not run here.
      - working-directory: apps/web
        run: bun run check

