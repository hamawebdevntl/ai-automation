# Postiz, adapted from upstream's docker-compose.yaml.
#
# Deployed as-is and only called over its REST API -- that network boundary is
# what keeps its AGPL licence at arm's length, so nothing here modifies it.
#
# Differences from upstream, all deliberate:
#   * spotlight, temporal-ui and temporal-admin-tools are dropped. They are
#     development conveniences and Elasticsearch already wants ~2GB.
#   * Image tags are pinned. `latest` on the service that publishes under our
#     own name is not something to leave to chance.
#   * Secrets and URLs come from .env, written at boot from Secrets Manager.
services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:v2.9.0
    container_name: postiz
    restart: always
    env_file: [.env]
    environment:
      IS_GENERAL: "true"
      STORAGE_PROVIDER: "local"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      TEMPORAL_ADDRESS: "temporal:7233"
      DATABASE_URL: "postgresql://postiz-user:${POSTIZ_DB_PASSWORD}@postiz-postgres:5432/postiz-db"
      REDIS_URL: "redis://postiz-redis:6379"
      # Internal tool: the first owner account is created once, then signup is
      # closed. Postiz's own login is the only boundary in front of an app that
      # can publish under our name.
      DISABLE_REGISTRATION: "true"
    volumes:
      - /data/postiz/config:/config/
      - /data/postiz/uploads:/uploads/
    ports: ["4007:5000"]
    networks: [postiz-network, temporal-network]
    depends_on:
      postiz-postgres: { condition: service_healthy }
      postiz-redis: { condition: service_healthy }

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_USER: postiz-user
      POSTGRES_PASSWORD: ${POSTIZ_DB_PASSWORD}
      POSTGRES_DB: postiz-db
    volumes: ["/data/postiz/postgres:/var/lib/postgresql/data"]
    networks: [postiz-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz-user -d postiz-db"]
      interval: 10s
      timeout: 3s
      retries: 5

  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    volumes: ["/data/postiz/redis:/data"]
    networks: [postiz-network]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: temporal-elasticsearch
    restart: always
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    volumes: ["/data/postiz/elasticsearch:/var/lib/elasticsearch/data"]
    networks: [temporal-network]

  temporal-postgresql:
    image: postgres:16
    container_name: temporal-postgresql
    restart: always
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
    volumes: ["/data/postiz/temporal-postgres:/var/lib/postgresql/data"]
    networks: [temporal-network]

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: temporal
    restart: always
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
    networks: [temporal-network]
    depends_on: [temporal-postgresql, temporal-elasticsearch]

networks:
  postiz-network:
  temporal-network:
