# Serving the approval SPA.
#
# The only rule that matters is the fallback: TanStack Router owns the paths, so
# a reload on /queue/<id> must return index.html rather than a 404.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
